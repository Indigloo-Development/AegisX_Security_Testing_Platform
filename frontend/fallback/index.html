n{min-width:0}.top{position:sticky;top:0;z-index:30;height:74px;display:flex;align-items:center;gap:12px;padding:0 28px;background:rgba(6,12,20,.93);backdrop-filter:blur(16px);border-bottom:1px solid rgba(32,50,71,.9)}.back{border:1px solid #29435c;background:#091523;color:#dceaf2;border-radius:10px;padding:9px 12px}.top h1{margin:0;font-size:18px}.top .right{margin-left:auto;display:flex;gap:9px;align-items:center}.status{padding:7px 10px;border-radius:999px;background:#08201b;border:1px solid #23564d;color:#91e5d3;font-size:11px;font-weight:800}.refresh{border:1px solid #29435c;background:#091523;color:#dceaf2;border-radius:10px;padding:9px 12px;font-weight:800}.page{padding:28px 30px 60px;max-width:1700px;margin:0 auto}.hero{display:flex;justify-content:space-between;gap:18px;padding:25px 27px;border:1px solid #223a51;border-radius:18px;background:linear-gradient(135deg,#0c1b2b,#08131f);box-shadow:var(--shadow);margin-bottom:18px}.hero h2{margin:5px 0 7px;font-size:31px}.hero p{margin:0;color:#91a8bc;max-width:900px}.eyebrow{font-size:10px;color:#63a1b7;letter-spacing:.12em;font-weight:900}.panel{background:linear-gradient(180deg,#0b1623,#08121d);border:1px solid #1e354b;border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}.panel h3{font-size:19px;margin:0 0 8px}.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.field{display:grid;gap:7px}.field span,.label{font-size:11px;color:#8fa5b8;text-transform:uppercase;letter-spacing:.08em;font-weight:850}.field input,.field select,.field textarea{width:100%;background:#06101a;color:#eef7fa;border:1px solid #244059;border-radius:10px;padding:12px 13px;min-height:44px;outline:none}.field textarea{min-height:160px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#5ce5c6;box-shadow:0 0 0 3px rgba(92,229,198,.08)}.btn{border:1px solid #29455d;background:#0b1826;color:#e3eff5;border-radius:10px;padding:10px 14px;font-weight:850}.btn.primary{background:var(--accent);color:#04110e;border-color:var(--accent)}.btn.danger{background:#3a1620;color:#ffc1c9;border-color:#714050}.btn.blue{background:#153659;color:#d8ebff;border-color:#2a5a83}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{border:1px solid #253b51;border-radius:15px;padding:18px;text-decoration:none;box-shadow:var(--shadow);transition:.18s}.metric:hover{transform:translateY(-2px)}.metric .lab{font-size:10px;font-weight:900;letter-spacing:.09em}.metric .num{font-size:31px;font-weight:1000;margin-top:6px}.metric.critical{background:var(--critical)}.metric.high{background:var(--high)}.metric.medium{background:var(--medium);color:#10150e}.metric.low{background:var(--low)}.metric.info{background:var(--info)}.charts{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:14px}.ring{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;margin:12px auto 16px}.ring:after{content:"";width:148px;height:148px;border-radius:50%;background:#091421}.ring .inside{position:absolute;text-align:center;z-index:2}.legend{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #1c3448}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.bars{display:grid;gap:12px;margin-top:14px}.barrow{display:grid;grid-template-columns:80px 1fr 40px;gap:9px;align-items:center}.track{height:10px;border-radius:999px;background:#102132;overflow:hidden}.fill{height:100%;border-radius:999px}.radar svg{width:100%;height:240px}.filter{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filter .field{min-width:240px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{border-bottom:1px solid #1d3347;padding:12px 11px;text-align:left;font-size:13px;vertical-align:top}.table th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7690a6;background:#07111c}.table tr:hover td{background:#091723}.sev,.state,.class-badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:900;text-transform:uppercase}.sev.critical{background:#6d0d18;color:#fff}.sev.high{background:#aa1e2d;color:#fff}.sev.medium{background:#e0bf35;color:#15140a}.sev.low{background:#2aa868;color:#fff}.sev.info{background:#439ed2;color:#fff}.state.open{background:#fff;color:#cf2e42}.state.closed{background:#fff;color:#2d9a62}.state.risk_accepted{background:#fff;color:#08744f}.state.ignored{background:#6b7380;color:#fff}.class-badge.false_positive{background:#fff;color:#248b51}.class-badge.exploitable{background:#fff;color:#cf2e42}.class-badge.need_further_investigate{background:#5e6773;color:#f3f6f8}.small{font-size:12px}.muted{color:#8197aa}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #29465e;background:#091722;color:#94aabd;border-radius:10px;padding:10px 13px;font-weight:800}.tab.active{background:#123046;color:#fff;border-color:#4a6d87;box-shadow:inset 0 -2px 0 var(--accent)}.logs{background:#030911;border:1px solid #183046;border-radius:12px;padding:14px;height:310px;overflow:auto;font:12px/1.55 ui-monospace,monospace}.log{display:grid;grid-template-columns:80px 70px 1fr;gap:10px;padding:4px 0}.log .lvl{font-weight:900}.log .INFO{color:#7ec7ff}.log .WARN{color:#e6c55d}.log .ERROR{color:#ff7787}.progress{height:9px;border-radius:99px;background:#142334;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.result-card{border:1px solid #20394f;border-radius:11px;padding:12px;background:#07121d}.result-card span{display:block;color:#6f879b;font-size:10px;text-transform:uppercase}.result-card b{display:block;margin-top:4px;font-size:18px}.finding{border:1px solid #233d53;border-radius:13px;overflow:hidden;margin-top:10px}.finding-head{display:flex;justify-content:space-between;gap:12px;padding:14px;align-items:center}.finding-head button{all:unset;cursor:pointer;display:block;flex:1}.finding-body{border-top:1px solid #20374d;padding:15px;background:#07111d}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{border:1px solid #1e354a;background:#06111b;border-radius:10px;padding:11px}.box span{display:block;color:#6f879b;font-size:10px;text-transform:uppercase}.box b{display:block;margin-top:4px;font-size:13px;word-break:break-word}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}.evidence pre{margin:6px 0 0;background:#030a11;border:1px solid #1d3247;color:#c9d7e1;padding:11px;border-radius:9px;white-space:pre-wrap;overflow:auto;font:11px/1.5 ui-monospace,monospace}.refs a{color:#73b6ff;text-decoration:underline;word-break:break-all}.proof img{max-width:100%;border:1px solid #35526b;border-radius:12px;cursor:zoom-in}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:18px;z-index:100}.modal-card{width:min(1180px,96vw);max-height:92vh;overflow:auto;background:#091522;border:1px solid #2a465e;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.5);padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.close{border:1px solid #2a465e;background:#0a1624;color:#dceaf2;border-radius:9px;padding:8px 11px}.reference-list{margin:0;padding-left:18px}.reference-list li{margin:5px 0}.notice{padding:12px 14px;border-radius:10px;margin:10px 0;border:1px solid #2b475f;background:#0b1b2a}.notice.error{border-color:#733a47;background:#2a1319;color:#ffc1c9}.backrow{display:flex;gap:9px;margin-bottom:14px}.action-menu{position:fixed;z-index:120;background:#091622;border:1px solid #2d4b63;border-radius:12px;box-shadow:0 25px 65px rgba(0,0,0,.45);padding:6px;min-width:180px}.action-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbe8ef;padding:10px;border-radius:8px}.action-menu button:hover{background:#10283b}@media(max-width:1200px){.shell{grid-template-columns:245px 1fr}.charts{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.result-grid{grid-template-columns:repeat(2,1fr)}.detailgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.metrics{grid-template-columns:1fr 1fr}.result-grid,.detailgrid,.twocol,.evidence{grid-template-columns:1fr}.page{padding:18px}}
</style><style>
:root{--font-ui:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

</style></head><body><div id="app"></div>
<script>
const API=(location.protocol==='http:'&&location.hostname==='127.0.0.1'?'http://127.0.0.1:8000':(location.protocol+'//'+location.hostname+':8000')).replace(/\/$/,'');
const S={route:location.hash.slice(1)||'dashboard',scan:'',severity:'',family:'',status:'',q:'',current:null,logs:[],poll:null,aiType:'llm'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.detail||`Request failed (${r.status})`);return d}
function emit(){window.dispatchEvent(new Event('aegisx:data-change'))}
function layout(title,subtitle,body){document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="mark">A</div><div><b>Aegis<span>X</span></b><div class="sub">Enterprise Security Platform</div></div></div><div class="engine">● ENGINE ONLINE · DIRECT ACCESS · V55</div><nav class="nav">${nav()}</nav></aside><main class="main"><header class="top"><button class="back" onclick="history.back()">← Back</button><div><div class="eyebrow">AEGISX COMMAND CENTER</div><h1>${esc(title)}</h1></div><div class="right"><button class="refresh" onclick="location.reload()">↻ Refresh</button><span class="status">● Connected</span></div></header><section class="page"><div class="hero"><div><div class="eyebrow">SECURITY OPERATIONS</div><h2>${esc(title)}</h2><p>${esc(subtitle||'Evidence-first application security assessment and vulnerability management.')}</p></div></div>${body}</section></main></div>`}
function nav(){return `<div class="nlabel">Overview</div><a href="#dashboard">◈ Overview</a><div class="nlabel">Web Security</div><a href="#web-security">◉ Web Security</a><div class="subnav"><a href="#web-new">New Assessment</a><a href="#web-auth">Authenticated Scan</a><a href="#csp">CSP Analyzer</a><a href="#jwt">JWT Analyzer</a></div><div class="nlabel">API Security</div><a href="#api-security">⌁ API Security</a><div class="subnav"><a href="#api-rest">REST API Scan</a><a href="#api-graphql">GraphQL Scan</a><a href="#api-grpc">gRPC Scan</a><a href="#api-soap">SOAP Scan</a><a href="#api-openapi">Swagger / OpenAPI</a><a href="#api-json">JSON / Code Analysis</a><a href="#api-discovery">Endpoint Discovery</a></div><div class="nlabel">SCA / SBOM</div><a href="#sca">◇ SCA & SBOM</a><div class="nlabel">AI Security</div><a href="#ai-security">✦ AI Security</a><div class="subnav"><a href="#ai-llm">LLM Security</a><a href="#ai-rag">RAG Security</a><a href="#ai-agent">Agent / MCP Security</a><a href="#ai-redteam">AI Red Team</a></div><div class="nlabel">Operations</div><a href="#findings">▣ Findings</a><a href="#issues">☷ Issue Track Base</a><a href="#reports">▤ Reports</a>`}
function sev(s){return `<span class="sev ${s}">${esc(s)}</span>`}function stateBadge(s){return `<span class="state ${s}">${esc((s||'open').replaceAll('_',' '))}</span>`}function clsBadge(s){return `<span class="class-badge ${s}">${esc((s||'need_further_investigate').replaceAll('_',' '))}</span>`}
function metric(k,v){return `<a class="metric ${k}" href="#findings" onclick="S.severity='${k}';setTimeout(findings,0)"><div class="lab">${k.toUpperCase()}</div><div class="num">${v||0}</div><div class="muted">View ${k} findings →</div></a>`}
async function dashboard(){try{
 const o=await api('/api/console/overview'+(S.scan?`?scan_id=${S.scan}`:''));
 const sc=await api('/api/console/assessments');
 const r=o.risk||{critical:0,high:0,medium:0,low:0,info:0};
 const vals=Object.values(r).map(Number); const total=Math.max(1,o.total_findings||0); const mx=Math.max(1,...vals);
 const selectedRows=await api('/api/console/findings'+(S.scan?`?scan_id=${S.scan}`:''));
 layout('Operational Overview','Risk distribution, frequency, completed assessments and actionable findings.',
 `<div class="metrics">${['critical','high','medium','low','info'].map(k=>metric(k,r[k])).join('')}</div>
 <div class="grid g4" style="margin-top:14px"><div class="result-card"><span>Total Issues</span><b>${o.total_findings}</b></div><div class="result-card"><span>Total Scans</span><b>${o.total_scans}</b></div><div class="result-card"><span>Open Issues</span><b>${o.open_issues}</b></div><div class="result-card"><span>Closed Issues</span><b>${o.closed_issues}</b></div></div>
 <div class="charts" style="margin-top:14px">
 <section class="panel"><h3>Risk Distribution</h3><div class="ring" style="background:conic-gradient(var(--critical) 0 ${(r.critical/total)*360}deg,var(--high) ${(r.critical/total)*360}deg ${((r.critical+r.high)/total)*360}deg,var(--medium) ${((r.critical+r.high)/total)*360}deg ${((r.critical+r.high+r.medium)/total)*360}deg,var(--low) ${((r.critical+r.high+r.medium)/total)*360}deg ${((r.critical+r.high+r.medium+r.low)/total)*360}deg,var(--info) ${((r.critical+r.high+r.medium+r.low)/total)*360}deg 360deg)"><div class="inside"><b style="font-size:28px">${o.total_findings}</b><div class="muted">Total Issues</div></div></div>${['critical','high','medium','low','info'].map(k=>`<div class="legend"><span><i class="dot" style="background:var(--${k})"></i>${k}</span><b>${r[k]||0}</b></div>`).join('')}</section>
 <section class="panel"><h3>Frequency</h3><div class="bars">${['critical','high','medium','low','info'].map(k=>`<div class="barrow"><span>${k}</span><div class="track"><div class="fill" style="width:${((r[k]||0)/mx)*100}%;background:var(--${k})"></div></div><b>${r[k]||0}</b></div>`).join('')}</div><h3 style="margin-top:24px">Vulnerability Discovered by Date</h3><div class="grid g2">${Object.entries(o.by_date||{}).sort().slice(-10).map(([d,v])=>`<div class="box"><span>${new Date(d).toLocaleDateString()}</span><b>${v} finding${Number(v)===1?'':'s'}</b></div>`).join('')||'<div class="muted">No historical findings yet.</div>'}</div></section>
 <section class="panel radar"><h3>Risk Radar</h3><svg viewBox="0 0 280 220"><polygon points="140,20 245,85 205,192 75,192 35,85" fill="none" stroke="#28445c"/><polygon points="140,50 205,90 182,162 98,162 75,90" fill="none" stroke="#1b3349"/><polygon points="140,${105-(r.critical/total)*70} ${140+(r.high/total)*100},${105-(r.high/total)*25} ${140+(r.medium/total)*62},${105+(r.medium/total)*74} ${140-(r.low/total)*62},${105+(r.low/total)*74} ${140-(r.info/total)*100},${105-(r.info/total)*25}" fill="rgba(92,229,198,.14)" stroke="#5ce5c6" stroke-width="2"/></svg><p class="muted">Severity distribution normalized across the selected assessment.</p></section>
 </div>
 <section class="panel filter"><div class="field"><span>Completed Assessment</span><select id="dashscan" onchange="S.scan=this.value;dashboard()"><option value="">All completed scans</option>${sc.filter(x=>x.status==='completed').map(x=>`<option value="${x.id}" ${String(S.scan)===String(x.id)?'selected':''}>${esc(x.assessment_name)} · ${esc(x.target_url)}</option>`).join('')}</select></div><span class="muted">Selecting an assessment updates all overview metrics and date data.</span></section>
 <section class="panel"><h3>Recent Vulnerabilities</h3><div class="table-wrap"><table class="table"><thead><tr><th>Issue</th><th>Severity</th><th>CVSS v4</th><th>CWE</th><th>OWASP</th><th>Status</th></tr></thead><tbody>${selectedRows.slice(0,10).map(rw=>`<tr onclick="openFinding(${rw.id})"><td><b>${esc(rw.title)}</b><div class="small muted">AX-${rw.id}</div></td><td>${sev(rw.severity)}</td><td>${esc(rw.cvss_v4)}</td><td>${esc(rw.cwe)}</td><td>${esc(rw.owasp_mapping)}</td><td>${stateBadge(rw.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No findings for this selection.</td></tr>'}</tbody></table></div></section>`);
 }catch(e){error(e.message)}}
async function awaitRows(scan){const rows=await api('/api/console/findings'+(scan?`?scan_id=${scan}`:''));return rows.map(r=>`<tr onclick="openFinding(${r.id})"><td><b>${esc(r.title)}</b><div class="small muted">AX-${r.id}</div></td><td>${sev(r.severity)}</td><td>${esc(r.cvss_v4)}</td><td>${esc(r.cwe)}</td><td>${esc(r.owasp_mapping)}</td><td>${stateBadge(r.status)}</td></tr>`)}
function formField(label,id,placeholder='',type='text'){return `<label class="field"><span>${label}</span><input id="${id}" type="${type}" placeholder="${esc(placeholder)}"></label>`}
function parentPage(kind){
 if(kind==='web'){layout('Web Security','Web Security assessment center. Scan and specialized analyzers are grouped below.',`<div class="cards"><a class="panel" href="#web-new"><h3>New Assessment</h3><p class="muted">Fast, Balanced or Deep Scan with live capture logs.</p></a><a class="panel" href="#web-auth"><h3>Authenticated Scan</h3><p class="muted">Authorized credentialed Web Security assessment.</p></a><a class="panel" href="#csp"><h3>CSP Analyzer</h3><p class="muted">HTTP response CSP and directive analysis.</p></a><a class="panel" href="#jwt"><h3>JWT Analyzer</h3><p class="muted">Readable header, payload, signature and security analysis.</p></a></div>`);}
 else if(kind==='api'){layout('API Security','Separate protocol analyzers with persisted assessments and OWASP API Security mapping.',`<div class="cards"><a class="panel" href="#api-rest"><h3>REST API Scan</h3><p class="muted">Endpoint and schema analysis.</p></a><a class="panel" href="#api-graphql"><h3>GraphQL Scan</h3><p class="muted">Schema, complexity and authorization analysis.</p></a><a class="panel" href="#api-grpc"><h3>gRPC Scan</h3><p class="muted">Proto, transport and reflection checks.</p></a><a class="panel" href="#api-soap"><h3>SOAP Scan</h3><p class="muted">WSDL/XML security analysis.</p></a><a class="panel" href="#api-openapi"><h3>Swagger / OpenAPI</h3><p class="muted">Schema and security requirement analysis.</p></a><a class="panel" href="#api-json"><h3>JSON / Code</h3><p class="muted">Source/config indicator analysis.</p></a><a class="panel" href="#api-discovery"><h3>Endpoint Discovery</h3><p class="muted">Discover exposed API metadata safely.</p></a></div>`);}
 else {layout('AI Security','Separate LLM, RAG, Agent/MCP and AI Red Team workspaces.',`<div class="cards"><a class="panel" href="#ai-llm"><h3>LLM Security</h3><p class="muted">Prompt injection, leakage and unsafe output.</p></a><a class="panel" href="#ai-rag"><h3>RAG Security</h3><p class="muted">Retrieval authorization and poisoning indicators.</p></a><a class="panel" href="#ai-agent"><h3>Agent / MCP Security</h3><p class="muted">Tool permissions, identity and MCP policies.</p></a><a class="panel" href="#ai-redteam"><h3>AI Red Team</h3><p class="muted">Bounded adaptive multi-turn campaigns.</p></a></div>`);}
}
function webPage(auth){layout(auth?'Authenticated Web Security Scan':'New Web Security Assessment',auth?'Authorized credentialed assessment with isolated credentials and live capture logs.':'Create a separate Web Security assessment with Fast, Balanced or Deep Scan.',`<section class="panel"><div class="grid ${auth?'g2':'g2'}">${formField('Assessment Name','wn','Production Web Assessment')}${formField('Target URL','wu','https://target.example.com')}${auth?formField('Username','wuser','authorized-user') : ''}${auth?formField('Password','wpass','Password','password'): ''}<label class="field"><span>Mode</span><select id="wmode"><option value="fast">Fast</option><option value="balanced" selected>Balanced</option><option value="deep">Deep Scan</option></select></label></div><div class="actions"><button class="btn primary" onclick="startWeb(${auth})">${auth?'Authenticate & Scan':'Start Scan'}</button></div><div id="wmsg"></div></section><div id="wscan"></div>`)}
async function startWeb(auth){try{const name=val('wn'),url=val('wu'),mode=val('wmode');if(!name||!url)throw Error('Assessment name and target URL are required.');const body={assessment_name:name,target_url:url,mode};if(auth){body.username=val('wuser');body.password=val('wpass');}const r=await api(auth?'/api/console/web/authenticated':'/api/console/web/assessment',{method:'POST',body:JSON.stringify(body)});pollScan(r.scan_id,'wscan')}catch(e){msg('wmsg',e.message)}}
function pollScan(id,target){clearInterval(S.poll);document.getElementById(target).innerHTML=`<section class="panel"><div class="result-card"><span>Assessment</span><b>#${id}</b></div><div class="progress"><i id="pbar" style="width:0%"></i></div><div id="plog" class="logs" style="margin-top:10px">Waiting for live capture logs…</div></section>`;S.poll=setInterval(async()=>{try{const [s,l,f]=await Promise.all([api('/api/scans/'+id),api('/api/scans/'+id+'/logs'),api('/api/console/findings?scan_id='+id)]);document.getElementById('pbar').style.width=(s.progress||0)+'%';document.getElementById('plog').innerHTML=(l||[]).map(x=>`<div class="log"><span>${new Date(x.timestamp).toLocaleTimeString()}</span><span class="lvl ${x.level}">${x.level}</span><span>${esc(x.message)}</span></div>`).join('')||'Waiting…';if(['completed','failed'].includes(s.status)){clearInterval(S.poll);showAssessmentResult(s,f,target)} }catch(e){clearInterval(S.poll)}} ,900)}
function showAssessmentResult(s,f,target){document.getElementById(target).insertAdjacentHTML('beforeend',`<section class="panel"><div class="result-grid"><div class="result-card"><span>Status</span><b>${esc(s.status)}</b></div><div class="result-card"><span>Total Findings</span><b>${f.length}</b></div><div class="result-card"><span>Critical</span><b>${f.filter(x=>x.severity==='critical').length}</b></div><div class="result-card"><span>High</span><b>${f.filter(x=>x.severity==='high').length}</b></div></div><h3 style="margin-top:16px">Findings</h3>${f.map(findingCard).join('')||'<div class="muted">No validated findings were created by this assessment.</div>'}</section>`);emit()}
function findingCard(f){return `<article class="finding"><div class="finding-head"><button onclick="toggleFinding(this)"><div><b>AX-${f.id} · ${esc(f.title)}</b><div class="small muted">${esc(f.category||'Security')} · ${esc(f.endpoint||'—')}</div></div></button>${sev(f.severity)}</div><div class="finding-body" style="display:none"><div class="detailgrid"><div class="box"><span>CVSS v4</span><b>${esc(f.cvss_v4)}</b></div><div class="box"><span>CVSS Vector</span><b>${esc(f.cvss_vector_v4||'Not provided')}</b></div><div class="box"><span>CWE</span><b>${esc(f.cwe)}</b></div><div class="box"><span>OWASP</span><b>${esc(f.owasp_mapping)}</b></div><div class="box"><span>Affected URL</span><b>${esc(f.endpoint)}</b></div><div class="box"><span>Parameter</span><b>${esc(f.affected_parameter||'—')}</b></div><div class="box"><span>Component</span><b>${esc(f.affected_component||'—')}</b></div><div class="box"><span>Test Payload</span><b>${esc(f.test_payload||'Not captured')}</b></div></div><div class="twocol"><div class="box"><span>Description</span><p>${esc(f.description)}</p></div><div class="box"><span>Business Impact</span><p>${esc(f.business_impact||f.risk_reason||'Contextual impact assessment required.')}</p></div></div><div class="box"><span>Remediation</span><p>${esc(f.remediation)}</p></div><div class="evidence"><div><span>HTTP Request</span><pre>${esc(f.http_request||'Not captured')}</pre></div><div><span>HTTP Response</span><pre>${esc(f.http_response||'Not captured')}</pre></div></div></div></article>`}
function toggleFinding(b){const p=b.parentElement.nextElementSibling;p.style.display=p.style.display==='none'?'block':'none'}
function apiPage(kind){const cfg={rest:['REST API Scan','endpoint','Target endpoint URL','/api/console/api/rest'],graphql:['GraphQL Scan','content','GraphQL schema/introspection JSON','/api/console/api/graphql'],grpc:['gRPC Scan','content','Proto definition / reflection output','/api/console/api/grpc'],soap:['SOAP Scan','content','WSDL / XML','/api/console/api/soap'],openapi:['Swagger / OpenAPI Analysis','content','OpenAPI / Swagger JSON','/api/console/api/swagger'],json:['JSON / Code Analysis','content','JSON / Source / Config','/api/console/api/json-code'],discovery:['API Endpoint Discovery','endpoint','Target API URL','/api/console/api/discover']}[kind];layout(cfg[0],'Independent API assessment with evidence, OWASP API Security mapping, CWE and persistent findings.',`<section class="panel">${cfg[1]==='endpoint'?formField(cfg[2],'apin','https://api.example.com'):formField('Analysis Input','apin','Paste schema / proto / XML / JSON here')} ${cfg[1]!=='endpoint'?'<label class="field"><span>Content</span><textarea id="apibox" placeholder="Paste content here"></textarea></label>':''}<div class="actions"><button class="btn primary" onclick="runApi('${kind}')">Run ${esc(cfg[0])}</button></div><div id="apimsg"></div><div id="apires"></div></section>`)}
async function runApi(kind){try{const map={rest:'/api/console/api/rest',graphql:'/api/console/api/graphql',grpc:'/api/console/api/grpc',soap:'/api/console/api/soap',openapi:'/api/console/api/swagger',json:'/api/console/api/json-code',discovery:'/api/console/api/discover'};const endpoint=val('apin'),content=document.getElementById('apibox')?.value||'';const body=kind==='rest'||kind==='discovery'?{endpoint}:{content};const r=await api(map[kind],{method:'POST',body:JSON.stringify(body)});document.getElementById('apires').innerHTML=resultStructured(r,'API SECURITY');emit()}catch(e){msg('apimsg',e.message)}}
function sca(){layout('SCA / SBOM','Dependency, package, framework and library analysis with manifest, repository and target modes.',`<div class="tabs"><button class="tab active" onclick="scaMode='repo';sca()">Repository</button><button class="tab" onclick="scaMode='url';sca()">Target URL</button><button class="tab" onclick="scaMode='manifest';sca()">Manifest / Code</button></div><section class="panel">${scaMode==='repo'?formField('Local Repository Address','scr','/opt/repos/project'):scaMode==='url'?formField('Target URL','scu','https://app.example.com'):'<div class="grid g2"><label class="field"><span>Manifest Type</span><select id="scf"><option>package.json</option><option>requirements.txt</option><option>pom.xml</option><option>build.gradle</option><option>go.mod</option><option>Cargo.toml</option><option>composer.json</option><option>Gemfile</option><option>pubspec.yaml</option><option>*.csproj</option><option>Package.swift</option><option>mix.exs</option></select></label></div><label class="field"><span>Paste Manifest / Code</span><textarea id="scc"></textarea></label>'}<div class="actions"><button class="btn primary" onclick="runSCA()">Run SCA / SBOM</button></div><div id="scmsg"></div><div id="scres"></div></section>`)}
let scaMode='repo';async function runSCA(){try{let r;if(scaMode==='repo')r=await api('/api/console/sca/repository',{method:'POST',body:JSON.stringify({source_path:val('scr')})});else if(scaMode==='url')r=await api('/api/console/sca/url',{method:'POST',body:JSON.stringify({target_url:val('scu')})});else r=await api('/api/console/sca/manifest',{method:'POST',body:JSON.stringify({content:document.getElementById('scc').value,filename:val('scf')})});document.getElementById('scres').innerHTML=resultStructured(r,'SCA / SBOM');emit()}catch(e){msg('scmsg',e.message)}}
function ai(type){const cfg={llm:['LLM Security','llm'],rag:['RAG Security','rag'],agent:['Agent / MCP Security','agent'],redteam:['AI Red Team','redteam']}[type];layout(cfg[0],'AI Security testing with structured, evidence-first output and central findings persistence.',`<section class="panel">${formField('Authorized AI Target URL','ait','https://authorized-ai.example/api/chat')}<label class="field"><span>Provider</span><select id="aip"><option>generic-json</option><option>openai-compatible</option><option>anthropic-compatible</option><option>gemini-compatible</option></select></label><div class="actions"><button class="btn primary" onclick="runAI('${type}')">Start ${esc(cfg[0])}</button></div><div id="aimsg"></div><div id="aires"></div></section>`)}
async function runAI(type){try{const r=await api('/api/console/ai/start',{method:'POST',body:JSON.stringify({kind:type==='redteam'?'redteam':type,target_url:val('ait'),provider:val('aip'),max_turns:3})});pollScan(r.scan_id,'aires')}catch(e){msg('aimsg',e.message)}}
function csp(){layout('CSP Analyzer','Target URL response analysis and independent CSP Directive Analysis.',`<div class="tabs"><button class="tab active" onclick="csp()">Target URL Scan</button><button class="tab" onclick="cspDirectives()">Directive Analysis</button></div><section class="panel">${formField('Target URL','cu','https://example.com')}<div class="actions"><button class="btn primary" onclick="runCSP()">Scan Target & Analyze CSP</button></div><div id="cmsg"></div><div id="cres"></div></section>`)}
async function runCSP(){try{const r=await api('/api/console/csp',{method:'POST',body:JSON.stringify({target_url:val('cu')})});document.getElementById('cres').innerHTML=resultStructured(r,'CSP');emit()}catch(e){msg('cmsg',e.message)}}
function cspDirectives(){layout('CSP Directive Analysis','Analyze only the pasted Content-Security-Policy directives.',`<section class="panel"><label class="field"><span>CSP Directive String</span><textarea id="cd">default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none';</textarea></label><div class="actions"><button class="btn primary" onclick="runCSPDirectives()">Analyze Directives</button></div><div id="cmsg"></div><div id="cres"></div></section>`)}
async function runCSPDirectives(){try{const r=await api('/api/console/csp/directives',{method:'POST',body:JSON.stringify({content:val('cd')})});document.getElementById('cres').innerHTML=resultStructured(r,'CSP DIRECTIVE ANALYSIS');emit()}catch(e){msg('cmsg',e.message)}}
function jwt(){layout('JWT Token Analyzer','Readable JWT analysis with separated Header, Payload, Signature and security findings.',`<section class="panel"><label class="field"><span>Encoded JWT Token</span><textarea id="jt" placeholder="eyJhbGciOiJIUzI1NiJ9..." style="min-height:190px"></textarea></label><div class="actions"><button class="btn primary" onclick="runJWT()">Decode & Analyze</button></div><div id="jmsg"></div><div id="jres"></div></section>`)}
async function runJWT(){try{const r=await api('/api/console/jwt',{method:'POST',body:JSON.stringify({content:val('jt')})});document.getElementById('jres').innerHTML=`<section class="panel"><div class="result-grid"><div class="result-card"><span>Algorithm</span><b>${esc(r.algorithm||'—')}</b></div><div class="result-card"><span>Signature</span><b>${r.signature_present?'Present':'Missing'}</b></div><div class="result-card"><span>Structure</span><b>${r.valid_structure?'Valid':'Invalid'}</b></div><div class="result-card"><span>Findings</span><b>${(r.findings||[]).length}</b></div></div><div class="twocol"><div class="box"><h3>Header</h3><pre>${esc(JSON.stringify(r.header||{},null,2))}</pre></div><div class="box"><h3>Signature</h3><p>Algorithm: <b>${esc(r.algorithm||'—')}</b></p><p>Secret Key: <b>Not derivable from JWT</b></p><p>Signature length: <b>${r.signature_segment_length||0}</b></p></div></div><div class="box"><h3>Payload</h3><pre>${esc(JSON.stringify(r.payload||{},null,2))}</pre><label class="field"><span>Payload Editor (local analysis only)</span><textarea id="jpe">${esc(JSON.stringify(r.payload||{},null,2))}</textarea></label></div>${(r.findings||[]).map(findingCard).join('')}</section>`;emit()}catch(e){msg('jmsg',e.message)}}
function resultStructured(r,domain){const fs=r.findings||r.flags||[];return `<div class="panel"><div class="result-grid"><div class="result-card"><span>Domain</span><b>${esc(domain)}</b></div><div class="result-card"><span>Findings</span><b>${fs.length}</b></div><div class="result-card"><span>Status</span><b>${esc(r.status||'completed')}</b></div><div class="result-card"><span>Assessment</span><b>#${esc(r.scan_id||'—')}</b></div></div>${r.headers?`<details style="margin-top:14px" open><summary><b>HTTP Response Headers</b></summary><pre>${esc(JSON.stringify(r.headers,null,2))}</pre></details>`:''}<div>${fs.map(findingCard).join('')||'<div class="notice">No findings were generated. Review scope and evidence; this does not prove absence of vulnerabilities.</div>'}</div></div>`}
function findings(){api('/api/console/assessments').then(sc=>{loadFindings(sc)}).catch(e=>error(e.message))}
async function loadFindings(sc){const qs=new URLSearchParams();if(S.scan)qs.set('scan_id',S.scan);if(S.severity)qs.set('severity',S.severity);if(S.family)qs.set('scanner_family',S.family);if(S.status)qs.set('status',S.status);let rows=await api('/api/console/findings?'+qs.toString());if(S.q)rows=rows.filter(r=>(r.title+' '+r.endpoint+' '+r.cwe+' '+r.owasp_mapping).toLowerCase().includes(S.q.toLowerCase()));layout('Findings','Central findings inventory. Every scanner updates this list through the same persisted assessment model.',`<section class="panel"><div class="filter"><div class="field"><span>Completed Assessment</span><select onchange="S.scan=this.value;findings()"><option value="">All completed scans</option>${sc.filter(x=>x.status==='completed').map(x=>`<option value="${x.id}" ${String(S.scan)===String(x.id)?'selected':''}>${esc(x.assessment_name)} · ${esc(x.target_url)}</option>`).join('')}</select></div><div class="field"><span>Domain</span><select onchange="S.family=this.value;findings()"><option value="">All domains</option><option value="web">Web</option><option value="api">API</option><option value="sca">SCA</option><option value="ai">AI / LLM</option><option value="rag">RAG</option><option value="agent">Agent / MCP</option><option value="specialized">CSP / JWT</option></select></div><div class="field"><span>Severity</span><select onchange="S.severity=this.value;findings()"><option value="">All severities</option>${['critical','high','medium','low','info'].map(x=>`<option ${S.severity===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><span>Status</span><select onchange="S.status=this.value;findings()"><option value="">All statuses</option>${['open','closed','risk_accepted','ignored'].map(x=>`<option value="${x}" ${S.status===x?'selected':''}>${x.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><span>Search</span><input oninput="S.q=this.value;loadFindings(${JSON.stringify(sc).replaceAll('\\','\\\\')})" placeholder="Issue, endpoint, CWE, OWASP"></div><button class="btn" onclick="findings()">↻ Refresh</button></div></section><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Issue</th><th>Severity</th><th>CVSS v4</th><th>CWE</th><th>OWASP</th><th>Verification</th><th>Classification</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="btn" onclick="openFinding(${r.id})">AX-${r.id} · ${esc(r.title)}</button><div class="small muted">${esc(r.endpoint||'—')}</div></td><td>${sev(r.severity)}</td><td>${esc(r.cvss_v4)}</td><td>${esc(r.cwe)}</td><td>${esc(r.owasp_mapping)}</td><td><select onchange="patchFinding(${r.id},{verification:this.value})"><option value="unreviewed" ${r.verification!=='reviewed'?'selected':''}>Unreviewed</option><option value="reviewed" ${r.verification==='reviewed'?'selected':''}>Reviewed</option></select></td><td>${clsBadge(r.classification||'need_further_investigate')}</td><td>${stateBadge(r.status)}</td><td><button class="btn" onclick="menuAt(event,${r.id})">⋯</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">No findings match the current filters.</td></tr>'}</tbody></table></div></section>`)}
async function patchFinding(id,body){await api('/api/console/findings/'+id,{method:'PATCH',body:JSON.stringify(body)});emit();findings();issues()}
async function deleteFinding(id){if(!confirm('Delete this finding permanently?'))return;await api('/api/console/findings/'+id,{method:'DELETE'});emit();findings();issues();dashboard()}
async function openFinding(id,edit=false){const f=await api('/api/console/findings/'+id);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="fm"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">AX-${f.id} · ${esc(f.category)}</div><h2>${esc(f.title)}</h2><div class="muted">${esc(f.endpoint||'—')}</div></div><button class="close" onclick="document.getElementById('fm').remove()">×</button></div><div class="detailgrid" style="margin-top:14px"><div class="box"><span>CVSS v4</span><b>${esc(f.cvss_v4)}</b></div><div class="box"><span>CVSS Vector</span><b>${esc(f.cvss_vector_v4||'Not provided')}</b></div><div class="box"><span>CWE</span><b>${esc(f.cwe)}</b></div><div class="box"><span>OWASP</span><b>${esc(f.owasp_mapping)}</b></div><div class="box"><span>Status</span><b>${stateBadge(f.status)}</b></div><div class="box"><span>Verification</span><b>${esc(f.verification)}</b></div><div class="box"><span>Classification</span><b>${clsBadge(f.classification)}</b></div><div class="box"><span>Confidence</span><b>${esc(f.confidence)}</b></div></div><div id="fed"><div class="twocol" style="margin-top:14px"><div class="box"><h3>Issue Description</h3><p>${esc(f.description||'—')}</p></div><div class="box"><h3>Business Impact</h3><p>${esc(f.business_impact||f.risk_reason||'—')}</p></div></div><div class="box"><h3>Remediation</h3><p>${esc(f.remediation||'—')}</p></div><div class="detailgrid"><div class="box"><span>Affected URL</span><b>${esc(f.affected_url||f.endpoint)}</b></div><div class="box"><span>Endpoint</span><b>${esc(f.endpoint)}</b></div><div class="box"><span>Parameter</span><b>${esc(f.affected_parameter)}</b></div><div class="box"><span>Component</span><b>${esc(f.affected_component)}</b></div><div class="box"><span>Test Payload</span><b>${esc(f.test_payload)}</b></div></div><div class="evidence"><div><span>HTTP Request</span><pre>${esc(f.http_request)}</pre></div><div><span>HTTP Response</span><pre>${esc(f.http_response)}</pre></div></div>${f.screenshot?`<div class="proof box"><h3>Proof of Concept Screenshot</h3><a href="${API+f.screenshot}" target="_blank"><img src="${API+f.screenshot}" alt="PoC screenshot"></a></div>`:''}<div class="box refs"><h3>References</h3><ul class="reference-list">${(f.references||[]).map(x=>`<li><a href="${esc(x)}" target="_blank" rel="noreferrer">${esc(x)}</a></li>`).join('')}</ul></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="editFinding(${f.id})">Edit Full Details</button><button class="btn danger" onclick="deleteFinding(${f.id});document.getElementById('fm').remove()">Delete</button></div></div></div>`)}
function editFinding(id){window.location.hash='edit-'+id;document.getElementById('fm')?.remove();loadEdit(id)}
async function loadEdit(id){const f=await api('/api/console/findings/'+id);layout('Edit Issue','Full-page editing. Changes persist to Findings, Issue Track Base, Overview and Reports.',`<div class="backrow"><button class="btn" onclick="location.hash='findings'">← Back to Findings</button></div><section class="panel"><div class="grid g2"><label class="field"><span>Issue Name</span><input id="e_title" value="${esc(f.title)}"></label><label class="field"><span>Severity</span><select id="e_sev">${['critical','high','medium','low','info'].map(x=>`<option ${f.severity===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Status</span><select id="e_status">${['open','closed','risk_accepted','ignored'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Verification</span><select id="e_ver"><option value="unreviewed" ${f.verification!=='reviewed'?'selected':''}>Unreviewed</option><option value="reviewed" ${f.verification==='reviewed'?'selected':''}>Reviewed</option></select></label><label class="field"><span>Classification</span><select id="e_cls">${['false_positive','exploitable','need_further_investigate'].map(x=>`<option value="${x}" ${f.classification===x?'selected':''}>${x.replaceAll('_',' ')}</option>`).join('')}</select></label><label class="field"><span>CVSS v4.0 Score</span><input id="e_cvss" value="${esc(f.cvss_v4)}"></label><label class="field"><span>CVSS v4.0 Vector</span><input id="e_vec" value="${esc(f.cvss_vector_v4||'')}"></label><label class="field"><span>CWE-ID</span><input id="e_cwe" value="${esc(f.cwe)}"></label></div><div class="grid g2" style="margin-top:12px"><label class="field"><span>OWASP / Framework</span><input id="e_owasp" value="${esc(f.owasp_mapping||f.framework_mapping||'')}"></label><label class="field"><span>Affected URL / Endpoint</span><input id="e_endpoint" value="${esc(f.endpoint||'')}"></label><label class="field"><span>Affected Parameter</span><input id="e_param" value="${esc(f.affected_parameter||'')}"></label><label class="field"><span>Affected Component</span><input id="e_comp" value="${esc(f.affected_component||'')}"></label><label class="field"><span>Test Payload</span><textarea id="e_payload">${esc(f.test_payload||'')}</textarea></label><label class="field"><span>References (one per line)</span><textarea id="e_refs">${esc((f.references||[]).join('\n'))}</textarea></label><label class="field" style="grid-column:1/-1"><span>Issue Description</span><textarea id="e_desc">${esc(f.description||'')}</textarea></label><label class="field" style="grid-column:1/-1"><span>Business Impact</span><textarea id="e_impact">${esc(f.business_impact||f.risk_reason||'')}</textarea></label><label class="field" style="grid-column:1/-1"><span>Remediation</span><textarea id="e_rem">${esc(f.remediation||'')}</textarea></label><label class="field" style="grid-column:1/-1"><span>HTTP Request</span><textarea id="e_req">${esc(f.http_request||'')}</textarea></label><label class="field" style="grid-column:1/-1"><span>HTTP Response</span><textarea id="e_resp">${esc(f.http_response||'')}</textarea></label></div><div class="actions"><button class="btn primary" onclick="saveEdit(${id})">Save All Changes</button><button class="btn" onclick="location.hash='issue-track-${id}'">Cancel</button></div></section>`)}
async function saveEdit(id){await api('/api/console/findings/'+id,{method:'PATCH',body:JSON.stringify({title:val('e_title'),severity:val('e_sev'),status:val('e_status'),verification:val('e_ver'),classification:val('e_cls'),cvss_v4:val('e_cvss'),cvss_vector_v4:val('e_vec'),cwe:val('e_cwe'),owasp_mapping:val('e_owasp'),endpoint:val('e_endpoint'),affected_parameter:val('e_param'),affected_component:val('e_comp'),test_payload:val('e_payload'),description:val('e_desc'),business_impact:val('e_impact'),remediation:val('e_rem'),http_request:val('e_req'),http_response:val('e_resp'),references:val('e_refs').split(/\n+/).map(x=>x.trim()).filter(Boolean)})});emit();S.scan='';location.hash='issues'}
function issues(){api('/api/console/assessments').then(async sc=>{let rows=await api('/api/console/findings'+(S.scan?`?scan_id=${S.scan}`:''));if(S.q)rows=rows.filter(r=>(r.title+' '+r.endpoint+' '+r.cwe+' '+r.owasp_mapping).toLowerCase().includes(S.q.toLowerCase()));layout('Issue Track Base','Knowledge-base style issue inventory with full review, classification, lifecycle status and evidence actions.',`<section class="panel"><div class="filter"><div class="field"><span>Completed Assessment</span><select onchange="S.scan=this.value;issues()"><option value="">All completed scans</option>${sc.filter(x=>x.status==='completed').map(x=>`<option value="${x.id}" ${String(S.scan)===String(x.id)?'selected':''}>${esc(x.assessment_name)} · ${esc(x.target_url)}</option>`).join('')}</select></div><div class="field"><span>Search</span><input oninput="S.q=this.value;issues()" placeholder="Issue, CWE, OWASP, URL"></div><button class="btn" onclick="issues()">↻ Refresh</button></div></section><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Issue</th><th>Severity</th><th>CVSS</th><th>CWE</th><th>OWASP</th><th>Verification</th><th>Classification</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>AX-${r.id} · ${esc(r.title)}</b><div class="small muted">${esc(r.endpoint)}</div></td><td>${sev(r.severity)}</td><td>${esc(r.cvss_v4)}</td><td>${esc(r.cwe)}</td><td>${esc(r.owasp_mapping)}</td><td><select onchange="patchFinding(${r.id},{verification:this.value})"><option value="unreviewed" ${r.verification!=='reviewed'?'selected':''}>Unreviewed</option><option value="reviewed" ${r.verification==='reviewed'?'selected':''}>Reviewed</option></select></td><td>${clsBadge(r.classification)}</td><td><select onchange="patchFinding(${r.id},{status:this.value})"><option value="open" ${r.status==='open'?'selected':''}>Open</option><option value="closed" ${r.status==='closed'?'selected':''}>Closed</option><option value="risk_accepted" ${r.status==='risk_accepted'?'selected':''}>Risk Accepted</option><option value="ignored" ${r.status==='ignored'?'selected':''}>Ignored</option></select></td><td><button class="btn" onclick="menuAt(event,${r.id})">⋯</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">No issues found.</td></tr>'}</tbody></table></div></section>`)}).catch(e=>error(e.message))}
function menuAt(ev,id){document.querySelector('.action-menu')?.remove();const r=ev.currentTarget.getBoundingClientRect();const d=document.createElement('div');d.className='action-menu';d.style.left=(r.left-165)+'px';d.style.top=(r.bottom+5)+'px';d.innerHTML=`<button onclick="openFinding(${id});this.parentNode.remove()">View</button><button onclick="editFinding(${id});this.parentNode.remove()">Edit</button><button onclick="deleteFinding(${id});this.parentNode.remove()">Delete</button>`;document.body.appendChild(d);setTimeout(()=>window.addEventListener('click',()=>d.remove(),{once:true}),0)}
function reports(){api('/api/console/assessments').then(sc=>{layout('Reports & Export Center','Professional report preview with expandable findings, evidence, PoC and export formats.',`<section class="panel"><div class="field"><span>Completed Assessment</span><select onchange="S.scan=this.value;loadReport()"><option value="">Select completed assessment</option>${sc.filter(x=>x.status==='completed').map(x=>`<option value="${x.id}">${esc(x.assessment_name)} · ${esc(x.target_url)}</option>`).join('')}</select></div></section><div id="rbody"></div>`)}).catch(e=>error(e.message))}
async function loadReport(){const id=S.scan;if(!id)return;const d=await api('/api/console/reports/'+id);document.getElementById('rbody').innerHTML=`<section class="panel"><div class="result-grid"><div class="result-card"><span>Assessment</span><b>${esc(d.assessment.name)}</b></div><div class="result-card"><span>Target</span><b>${esc(d.assessment.target)}</b></div><div class="result-card"><span>Findings</span><b>${d.findings.length}</b></div><div class="result-card"><span>Status</span><b>${esc(d.assessment.status)}</b></div></div><div class="actions">${['pdf','html','xls','json','csv'].map(x=>`<button class="btn blue" onclick="downloadReport('${x}',${id})">Export ${x.toUpperCase()}</button>`).join('')}</div>${d.findings.map(r=>`<article class="finding"><div class="finding-head"><button onclick="toggleFinding(this)"><b>AX-${r.issue_id} · ${esc(r.issue_name)}</b><div class="small muted">${esc(r.endpoint)}</div></button>${sev(r.severity)}</div><div class="finding-body" style="display:none"><div class="detailgrid"><div class="box"><span>CVSS v4</span><b>${esc(r.cvss_v4)}</b></div><div class="box"><span>CVSS Vector</span><b>${esc(r.cvss_vector_v4||'Not provided')}</b></div><div class="box"><span>CWE</span><b>${esc(r.cwe)}</b></div><div class="box"><span>OWASP</span><b>${esc(r.owasp)}</b></div></div><div class="twocol"><div class="box"><h3>Description</h3><p>${esc(r.description)}</p></div><div class="box"><h3>Business Impact</h3><p>${esc(r.impact)}</p></div></div><div class="box"><h3>Remediation</h3><p>${esc(r.remediation)}</p></div><div class="evidence"><div><span>Request</span><pre>${esc(r.http_request)}</pre></div><div><span>Response</span><pre>${esc(r.http_response)}</pre></div></div>${r.screenshot?`<div class="proof box"><a href="${API+r.screenshot}" target="_blank"><img src="${API+r.screenshot}" alt="PoC"/></a></div>`:''}<div class="refs"><h3>References</h3><ul class="reference-list">${(r.references||[]).map(x=>`<li><a href="${esc(x)}" target="_blank">${esc(x)}</a></li>`).join('')}</ul></div></div></article>`).join('')}</section>`}
async function downloadReport(fmt,id){const r=await fetch(API+'/api/console/reports/'+id+'/export/'+fmt);if(!r.ok)throw Error('Export failed');const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`aegisx-assessment-${id}.${fmt}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function val(id){return document.getElementById(id)?.value||''}function msg(id,t){const e=document.getElementById(id);if(e)e.innerHTML=`<div class="notice error">${esc(t)}</div>`}function error(t){document.getElementById('app').innerHTML=`<div style="padding:30px"><div class="notice error">${esc(t)}</div></div>`}
function route(){const v=location.hash.slice(1)||'dashboard';S.route=v; if(v==='dashboard')dashboard();else if(v==='web-security')parentPage('web');else if(v==='api-security')parentPage('api');else if(v==='ai-security')parentPage('ai');else if(v==='web-new')webPage(false);else if(v==='web-auth')webPage(true);else if(v==='api-rest')apiPage('rest');else if(v==='api-graphql')apiPage('graphql');else if(v==='api-grpc')apiPage('grpc');else if(v==='api-soap')apiPage('soap');else if(v==='api-openapi')apiPage('openapi');else if(v==='api-json')apiPage('json');else if(v==='api-discovery')apiPage('discovery');else if(v==='sca')sca();else if(v==='ai-llm')ai('llm');else if(v==='ai-rag')ai('rag');else if(v==='ai-agent')ai('agent');else if(v==='ai-redteam')ai('redteam');else if(v==='csp')csp();else if(v==='jwt')jwt();else if(v==='findings')findings();else if(v==='issues')issues();else if(v.startsWith('edit-'))loadEdit(Number(v.slice(5)));else if(v==='reports')reports();else dashboard()}
window.addEventListener('hashchange',route);window.addEventListener('aegisx:data-change',()=>{if(['dashboard','findings','issues','reports'].includes(S.route))route()});window.addEventListener('focus',()=>{if(['dashboard','findings','issues','reports'].includes(S.route))route()});route();
</script></body></html>
