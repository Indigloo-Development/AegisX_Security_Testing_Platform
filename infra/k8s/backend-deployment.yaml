apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisx-backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: aegisx-backend }
  template:
    metadata:
      labels: { app: aegisx-backend }
    spec:
      containers:
        - name: backend
          image: aegisx/backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: aegisx-backend-secrets }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: aegisx-backend
spec:
  selector: { app: aegisx-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
