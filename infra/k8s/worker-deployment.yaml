apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisx-scanner-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisx-scanner-worker
  template:
    metadata:
      labels:
        app: aegisx-scanner-worker
    terminationGracePeriodSeconds: 30
    spec:
      serviceAccountName: aegisx-scanner-worker
      containers:
        - name: worker
          image: aegisx-backend:latest
          command: ["python", "-m", "app.worker_v33"]
          env:
            - name: AEGISX_QUEUE_BACKEND
              value: redis
            - name: AEGISX_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: aegisx-queue
                  key: url
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisx-scanner-worker
